name: build

# Roda ao enviar (push) qualquer branch para o GitHub, ou manualmente pela
# aba Actions ("Run workflow"). Não precisa mexer aqui.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      # Etapa 1 descrita no BUILD.md: compilar e rodar os 92 testes do
      # núcleo DSP primeiro. Se algum falhar, o job para aqui de propósito
      # e o APK nem chega a ser montado.
      - name: Compilar e rodar os 92 testes do núcleo DSP (C++)
        run: |
          cd native
          g++ -std=c++17 -O2 -Iinclude -Itests src/*.cpp tests/host_test.cpp -o metest
          ./metest

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Garante o Android SDK (sdkmanager) no runner, com ANDROID_HOME
      # configurado, independente do que já vier pré-instalado na imagem.
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar NDK, CMake e a plataforma Android 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v6

      # O wrapper (gradlew) não vem no repositório — este passo o gera,
      # exatamente como o Caminho 2 do BUILD.md instrui a fazer na mão.
      - name: Gerar o gradlew (wrapper)
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x ./gradlew

      # Etapa 2 descrita no BUILD.md: montar o APK de release.
      # Já sai assinado com a chave de debug (ver app/build.gradle.kts),
      # por isso instala direto no celular sem passo extra de assinatura.
      - name: Montar o APK de release
        run: ./gradlew assembleRelease --stacktrace

      - name: Publicar o APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicEnhancer-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
