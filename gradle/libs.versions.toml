[versions]
agp = "8.7.3"
kotlin = "2.0.21"
media3 = "1.11.0"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
datastore = "1.1.1"
documentfile = "1.0.1"
coroutines = "1.9.0"
serialization = "1.7.3"

[libraries]
androidx-core-ktx        = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose= { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime= { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service= { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-documentfile    = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-datastore       = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom              = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui               = { module = "androidx.compose.ui:ui" }
compose-graphics         = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3        = { module = "androidx.compose.material3:material3" }
compose-material-icons   = { module = "androidx.compose.material:material-icons-extended" }
media3-exoplayer         = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session           = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common            = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-datasource        = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
kotlinx-coroutines       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit                    = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization= { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
